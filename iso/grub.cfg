# @NAME@ @VERSION@ live/installer ISO (BIOS and UEFI)
set default=0
set timeout=8
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod font
if loadfont unicode ; then
	set gfxmode=1024x768,auto
	set gfxpayload=keep
	terminal_output gfxterm
fi

set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=black/brown

set rise_common="boot=casper quiet loglevel=3 systemd.show_status=false rd.systemd.show_status=false rd.udev.log_level=3 net.ifnames=0 biosdevname=0 fsck.mode=skip noprompt"

menuentry "Install @NAME@ @VERSION@" {
	linux /casper/vmlinuz $rise_common rise.installer video=1024x768 ---
	initrd /casper/initrd
}
menuentry "Install @NAME@ (native screen resolution)" {
	linux /casper/vmlinuz $rise_common rise.installer ---
	initrd /casper/initrd
}
menuentry "Install @NAME@ (safe graphics)" {
	set gfxpayload=text
	linux /casper/vmlinuz $rise_common rise.installer nomodeset ---
	initrd /casper/initrd
}
menuentry "Rescue shell (live system, no installer)" {
	linux /casper/vmlinuz $rise_common rise.rescue video=1024x768 ---
	initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
	menuentry "UEFI firmware settings" {
		fwsetup
	}
fi
