# RISE Linux build settings. build.sh reads this file; any of these can also be
# set in the environment (an environment value wins), for example:
#   sudo UBUNTU_SUITE=noble SOFTETHER_SRC=/path/to/SoftEtherVPN ./build.sh

RISE_NAME="${RISE_NAME:-RISE Linux}"
RISE_VERSION="${RISE_VERSION:-1.0.0}"

# Ubuntu Server base. The suite must be known to the host's debootstrap.
UBUNTU_SUITE="${UBUNTU_SUITE:-noble}"
UBUNTU_MIRROR="${UBUNTU_MIRROR:-http://archive.ubuntu.com/ubuntu}"
UBUNTU_SECURITY_MIRROR="${UBUNTU_SECURITY_MIRROR:-http://security.ubuntu.com/ubuntu}"
# The HWE kernel follows newer hardware (NICs, GPUs for the console).
KERNEL_PKG="${KERNEL_PKG:-linux-generic-hwe-24.04}"
ARCH="${ARCH:-amd64}"

# SoftEther VPN source. A local directory is copied as it is, uncommitted
# changes included (its git metadata is used to fetch the submodules into the
# copy, never into the original). A URL is cloned at SOFTETHER_REF.
SOFTETHER_SRC="${SOFTETHER_SRC:-../SoftEtherVPN}"
SOFTETHER_REF="${SOFTETHER_REF:-master}"
SOFTETHER_BUILD_NUMBER="${SOFTETHER_BUILD_NUMBER:-}"
# liboqs / oqs-provider: post-quantum TLS groups. Off keeps the build small;
# OpenSSL >= 3.5 has them natively anyway.
SOFTETHER_OQS="${SOFTETHER_OQS:-OFF}"

# Full cone NAT: xt_FULLCONENAT (IPv4 and IPv6), built with DKMS so a kernel
# update rebuilds it.
FULLCONENAT_REPO="${FULLCONENAT_REPO:-https://github.com/llccd/netfilter-full-cone-nat}"
FULLCONENAT_REF="${FULLCONENAT_REF:-4254b6801416b510930a0efa0563e9233381a15e}"

# WebGUI fonts (Manrope, JetBrains Mono), bundled so the page needs no
# internet. 0 uses the system font stack instead.
WEBGUI_FONTS="${WEBGUI_FONTS:-1}"

BUILD_DIR="${BUILD_DIR:-build}"
OUT_DIR="${OUT_DIR:-out}"
